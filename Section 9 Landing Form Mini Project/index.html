<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/favicon.png">
    <title>Bono Landing Form Mini Project</title>
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <a href="index.html">
                <img class="logo" src="images/logo.svg" alt="#">
            </a>
            <div class="header-right">
                <div>
                    <i class="fas fa-envelope"></i> contact@bono.com
                </div>
                <div>
                    <i class="fas fa-phone"></i> (+880 2222222222)
                </div>
                <a href="#">
                    <i class="fa-brands fa-twitter"></i>
                </a>
            </div>
        </header>

        <main class="main-content">
            <form >
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" name="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" required></textarea>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn"> Submit</button>
                </div>


            </form>

            <div class="text-container">
                <h1>Coming Soon for Every Developer</h1>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorem exercitationem deserunt aspernatur a quia quisquam quidem porro velit, laborum repudiandae!</p>
            </div>
        </main>
    </div>
</body>
</html>
