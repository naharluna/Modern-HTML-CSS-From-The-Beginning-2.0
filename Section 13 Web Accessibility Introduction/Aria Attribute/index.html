<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria Attribute</title>
</head>
<body>
    <!-- Aria Label -->
     <a href="#menu" aria-label="Open Menu" role="button">
        <svg viewBox="0 0 100 80" width="40" height="40" fill="black">
            <rect width="100" height="20"></rect>
            <rect y="30" width="100" height="20"></rect>
            <rect y="60" width="100" height="20"></rect>
        </svg>
     </a>

    <!-- Aria Labelledby -->
    <h2 id="fruit-heading">Available Fruit</h2>
    <ul role="listbox" aria-labelledby="fruit-heading">
         <li role="option">Apple</li>
        <li role="option" >Graphes</li>
        <li role="option">Orange</li>
         <li role="option">Cherry</li>
    </ul>

    <!-- Hidden -->
     <p aria-hidden="true">Lorem ipsum dolor sit amet.</p>
     <p aria-hidden="false">Lorem ipsum dolor sit amet.</p>
</body>
</html>
